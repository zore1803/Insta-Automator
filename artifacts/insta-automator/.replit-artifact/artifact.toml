kind = "web"
previewPath = "/"
title = "Insta Automator"
version = "1.0.0"
id = "artifacts/insta-automator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24744

[services.development]
run = "pnpm --filter @workspace/insta-automator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/insta-automator", "run", "build" ]
publicDir = "artifacts/insta-automator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24744"
BASE_PATH = "/"
